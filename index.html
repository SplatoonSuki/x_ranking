<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>スプラ3 Xランキング統計</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="assets/Xマッチ.ico">
  <script type="module" src="main.js" defer></script>
</head>
<body>

<header>
  <button data-page="ranking">Xランキング</button>
  <button data-page="usage" class="active-btn">ブキ別使用率</button>
  <button data-page="history">歴代</button>
</header>

<main>
<div id="ranking" class="view">
  <div class="view-head">
    <div>
      <div class="view-title">Xランキング</div>
      <div class="view-desc">各ルールの上位500名を表示します。</div>
    </div>
    <div class="view-controls">
      <div class="select-wrap">
        <select class="season-select" id="ranking-season"></select>
      </div>
      <span class="season-period" id="ranking-season-period"></span>
      <div class="rule-tabs" data-target="ranking">
        <button class="rule-tab active" data-rule="eria">エリア</button>
        <button class="rule-tab" data-rule="yagura">ヤグラ</button>
        <button class="rule-tab" data-rule="hoko">ホコ</button>
        <button class="rule-tab" data-rule="asari">アサリ</button>
      </div>
    </div>
  </div>
  <div class="filter-row">
    <input type="text" class="filter-input" id="ranking-filter" placeholder="プレイヤー名・ブキ名で検索">
  </div>
  <div class="rank-list" id="rank-list"></div>
</div>
<div id="usage" class="view active">
  <div class="view-head">
    <div>
      <div class="view-title">ブキ別使用率</div>
      <div class="view-desc">王冠2,000名の使用ウェポンを集計します。</div>
    </div>
    <div class="view-controls">
      <div class="select-wrap">
        <select class="season-select" id="usage-season"></select>
      </div>
      <span class="season-period" id="usage-season-period"></span>
      <div class="dim-tabs" id="usage-dim-tabs">
        <button class="dim-tab active" data-dim="set">セット</button>
        <button class="dim-tab" data-dim="main">メイン</button>
        <button class="dim-tab" data-dim="sub">サブ</button>
        <button class="dim-tab" data-dim="special">スペシャル</button>
        <button class="dim-tab" data-dim="category">カテゴリ</button>
        <button class="dim-tab" data-dim="range">射程</button>
      </div>
    </div>
  </div>
  <div class="filter-row">
    <div class="dim-tabs" id="usage-metric-tabs">
      <button class="dim-tab active" data-metric="pct">割合(%)</button>
      <button class="dim-tab" data-metric="count">人数</button>
      <button class="dim-tab" data-metric="hensachi">偏差値</button>
    </div>
    <label class="scope-toggle">
      <input type="checkbox" id="scope-merge-toggle">
      スコープをチャージャーと同一視する
    </label>
  </div>
  <div class="usage-table-wrap" id="usage-table-wrap"></div>
</div>
<div id="history" class="view">

  <div class="history-section">
    <div class="view-head">
      <div>
        <div class="view-title">ブキ別の歴代推移</div>
        <div class="view-desc">選んだウェポンのシーズンごと使用率の変化を表示します。</div>
      </div>
      <div class="view-controls">
        <div class="dim-tabs" id="history-dim-tabs">
          <button class="dim-tab active" data-dim="set">セット</button>
          <button class="dim-tab" data-dim="main">メイン</button>
          <button class="dim-tab" data-dim="sub">サブ</button>
          <button class="dim-tab" data-dim="special">スペシャル</button>
          <button class="dim-tab" data-dim="category">カテゴリ</button>
          <button class="dim-tab" data-dim="range">射程</button>
        </div>
      </div>
    </div>
    <div class="filter-row">
      <div class="select-wrap">
        <select class="season-select" id="history-weapon-select"></select>
      </div>
      <div class="dim-tabs" id="history-metric-tabs">
        <button class="dim-tab active" data-metric="pct">割合(%)</button>
        <button class="dim-tab" data-metric="count">人数</button>
      </div>
    </div>
    <div class="history-weapon-heading" id="history-weapon-heading"></div>
    <div class="usage-table-wrap" id="history-weapon-table-wrap"></div>
  </div>

</div>
</main>

</body>
</html>
